# =============================================================================
# CI - every job calls a Makefile target, so CI and a laptop run identical
# commands. Tool versions match the versions the labs were verified with.
#
#   static-and-unit   make ci lab1-e2e    no Docker and NO CLOUD ACCOUNT: fmt, validate,
#                                         tflint (including the aws ruleset), trivy,
#                                         38 terraform test runs - 16 local and 22 AWS
#                                         against mock_provider - for_each demos,
#                                         ansible-lint, syntax, 39 lab 3 unit tests;
#                                         then apply, verify, tamper, remediate and
#                                         destroy both local Terraform environments
#   ansible           make lab2-up lab2-test lab2-patch-demo
#                                         real containers: converge, idempotence,
#                                         input contract, anti-pattern demo, drift cycle,
#                                         rolling patch
#   kernel            make lab2-distros-up lab2-kernel-test
#                                         four distributions (AlmaLinux 9, Ubuntu 24.04,
#                                         SLES 15, Amazon Linux 2023): each one's own
#                                         boot-argument mechanism, idempotence, and the
#                                         input contract and merge behaviour
#   bare-metal        make lab3-artifacts dhcpd -t, ksvalidator and cloud-init schema on
#                                         the rendered files
#
# Two things are deliberately NOT jobs here, because a commit gate should be
# fast and free:
#   * lab2-vms-up / lab2-kernel-reboot - four QEMU virtual machines, two reboots
#     and a kernel upgrade each, about 15 minutes. It is the only way to test
#     that the boot arguments take effect, and it has been run locally; nested
#     virtualisation on a hosted runner would fall back to emulation and take
#     far longer.
#   * labs/lab2-ansible/aws - four EC2 instances. It creates billable resources.
#
# No job needs AWS credentials. The AWS Terraform is validated, linted, scanned and
# apply-tested against mocks; `terraform apply` against a real account is deliberately
# not run anywhere (see docs/aws-platform.md for what is exercised and what is not).
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.16.1"
  TFLINT_VERSION: "v0.61.0"
  TRIVY_VERSION: "0.74.0"
  ANSIBLE_CORE_VERSION: "2.21.4"
  ANSIBLE_LINT_VERSION: "26.8.0"

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false   # the wrapper rewrites exit codes; drift checks depend on them

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Install trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: pip install "ansible-core==${ANSIBLE_CORE_VERSION}" "ansible-lint==${ANSIBLE_LINT_VERSION}" pyyaml

      # `tflint --init` for the aws ruleset is inside the lab1-aws-static target,
      # so CI needs no extra step for it and a laptop gets the same behaviour.
      - name: make ci
        run: make ci

      - name: Terraform environments - apply, verify, tamper, remediate, destroy
        run: make lab1-e2e

  ansible:
    runs-on: ubuntu-latest
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install "ansible-core==${ANSIBLE_CORE_VERSION}"

      - name: Create lab hosts
        run: make lab2-up

      - name: Converge, idempotence, input contract, anti-patterns, drift
        run: make lab2-test

      - name: Rolling patch demo
        run: make lab2-patch-demo

  kernel:
    runs-on: ubuntu-latest
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install "ansible-core==${ANSIBLE_CORE_VERSION}"

      # Four distributions, pulled from public registries - no subscription and
      # no credentials. The SUSE image is SUSE's own BCI base.
      - name: Create the four distribution hosts
        run: make lab2-distros-up

      - name: Kernel tuning on four distributions, plus the input contract
        run: make lab2-kernel-test

  bare-metal:
    runs-on: ubuntu-latest
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4

      - name: Validate rendered DHCP, kickstart and cloud-init files with the real parsers
        run: make lab3-artifacts
