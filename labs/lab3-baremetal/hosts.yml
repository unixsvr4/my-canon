# =============================================================================
# hosts.yml - THE SOURCE OF TRUTH for every build artifact in this lab.
#
# Nothing about a server is decided at a console. From this one file,
# scripts/render.py generates:
#   out/ks/<mac>.cfg          the per-host kickstart (the path boot.ipxe requests)
#   out/dhcpd-hosts.conf      DHCP reservations, MAC -> fixed address
#   out/inventory.yml         the Ansible inventory that hands each new server to
#                             configuration management (Lab 2's baseline role)
#
# scripts/validate_hosts.py refuses to render anything if this file is wrong:
# duplicate MACs or IPs, an address outside its gateway's subnet, a bad VLAN, a
# bond with one member, a missing field.
#
# In production this is the CMDB/DCIM (NetBox, Nautobot, a vendor DCIM), queried
# over its API - but the shape of a record is the same.
# =============================================================================
hosts:
  - hostname: canon-gw01
    mac: "3c:ec:ef:11:22:33"
    ip: 10.20.4.11
    prefix: 24
    gateway: 10.20.4.1
    nameserver: 10.20.1.10
    vlan: 240
    role: gateway
    profile: rhel9-min
    rack: DC1-R14
    unit: 22
    bond_members: [ens1f0, ens1f1]
    disk: /dev/nvme0n1

  - hostname: canon-gw02
    mac: "3c:ec:ef:11:22:34"
    ip: 10.20.4.12
    prefix: 24
    gateway: 10.20.4.1
    nameserver: 10.20.1.10
    vlan: 240
    role: gateway
    profile: rhel9-min
    rack: DC1-R14
    unit: 23
    bond_members: [ens1f0, ens1f1]
    disk: /dev/nvme0n1

  - hostname: canon-db01
    mac: "3c:ec:ef:11:23:01"
    ip: 10.20.5.21
    prefix: 24
    gateway: 10.20.5.1
    nameserver: 10.20.1.10
    vlan: 250
    role: database
    profile: rhel9-min
    rack: DC1-R15
    unit: 10
    bond_members: [ens2f0, ens2f1]
    disk: /dev/sda
