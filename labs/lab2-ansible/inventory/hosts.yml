---
# =============================================================================
# Inventory: WHAT exists, and how it is grouped. Variables live in group_vars/
# and host_vars/, not here - so this file stays a readable list of machines.
#
# Static so the lab is self-contained. In production this is a DYNAMIC
# inventory plugin (vCenter, the CMDB, or aws_ec2 keyed on tags). A
# hand-maintained host list is itself a drift surface: a server that exists
# but isn't listed is never patched and never checked.
#
# Hosts are grouped on three independent axes. Each answers a different
# question a rollout has to ask:
#   1. What is it?             linux / rhel9       -> which roles and OS defaults apply
#   2. What does it run?       web / db / app      -> drain behaviour, health checks, tuning
#   3. When can it be touched? canary / window_*   -> batching and maintenance windows
# =============================================================================
all:
  children:

    # --- 1. What is it ---------------------------------------------------------
    linux:
      children:
        rhel9:
          hosts:
            # ansible_host maps the inventory NAME to how we reach it - here a
            # container name, in production a DNS name or IP from the CMDB.
            web01: { ansible_host: lab-web01 }
            web02: { ansible_host: lab-web02 }
            web03: { ansible_host: lab-web03 }
            db01: { ansible_host: lab-db01 }
            db02: { ansible_host: lab-db02 }
            app01: { ansible_host: lab-app01 }

    # --- 2. What does it run ---------------------------------------------------
    web:
      hosts: { web01: {}, web02: {}, web03: {} }
    db:
      hosts: { db01: {}, db02: {} }
    app:
      hosts: { app01: {} }

    # --- 3. When can it be touched ---------------------------------------------
    canary:
      hosts: { web01: {} }
    window_sat_2200:
      hosts: { web01: {}, web02: {}, web03: {}, app01: {} }
    window_sun_0200:
      hosts: { db01: {}, db02: {} }
    never_unattended:
      hosts: { db01: {} }  # a human watches this one, always
