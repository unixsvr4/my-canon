# =============================================================================
# ansible.cfg - project-local configuration. Ansible reads ./ansible.cfg when
# run from this directory, so the lab behaves the same on every machine.
# =============================================================================
[defaults]
inventory             = inventory/hosts.yml
roles_path            = roles

# Collections are installed per project from requirements.yml (setup.sh).
collections_path      = ./collections

# Containers have no usable HOME for the default remote tmp dir.
remote_tmp            = /tmp/.ansible
interpreter_python    = /usr/bin/python3
host_key_checking     = False

# Readable task results, plus per-task timing at the end of each run.
result_format         = yaml
callbacks_enabled     = ansible.posix.profile_tasks

# Parallelism WITHIN a batch. `serial` in patch.yml controls batch size;
# forks controls how many hosts in that batch run at once.
forks                 = 25

# Failed hosts are written to reports/<playbook>.retry, so a re-run can target
# only them:  ansible-playbook patch.yml --limit @reports/patch.retry
retry_files_enabled   = True
retry_files_save_path = ./reports

[inventory]
# Inventory plugins must be enabled explicitly. `auto` covers most plugins by
# reading their `plugin:` key, and aws_ec2 is named anyway so that a
# misconfigured file fails with a plugin error rather than being silently
# parsed as a YAML inventory full of nothing.
enable_plugins = amazon.aws.aws_ec2, auto, yaml, ini

# A plugin config that cannot be parsed is an error, not an empty inventory.
# The default is to warn and carry on, which produces "skipping: no hosts
# matched" on a fleet that definitely exists.
unparsed_is_failed = True
