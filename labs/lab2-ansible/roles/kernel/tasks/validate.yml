---
# =============================================================================
# Reject impossible input BEFORE touching the host.
#
# argument_specs.yml (see meta/) checks types and enumerations for free. What
# it cannot check is anything that depends on THIS host: whether the running
# kernel has the keys being configured, and whether the boot arguments are
# syntactically usable. Those are here.
# =============================================================================

- name: Validate | The requested profile exists
  ansible.builtin.assert:
    that:
      - kernel_profile in kernel_profiles
    fail_msg: >-
      Unknown kernel_profile '{{ kernel_profile }}'.
      Available: {{ kernel_profiles.keys() | sort | join(', ') }}.
    success_msg: "profile {{ kernel_profile }}"
    quiet: true

- name: Validate | This distribution has a known persistence mechanism
  ansible.builtin.assert:
    that:
      - kernel_bootloader_style is defined
      - kernel_bootloader_style in ['grub-file', 'grub-dropin']
    fail_msg: >-
      No kernel persistence mechanism is defined for
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      (os_family {{ ansible_facts['os_family'] }}). Add a vars/family-*.yml for it -
      writing a sysctl file and hoping is not a mechanism.
    quiet: true

# ---------------------------------------------------------------------------
# THE CHECK THAT EARNS ITS KEEP.
#
# A sysctl key that the running kernel does not implement is, depending on the
# distribution and the version, either silently skipped by `sysctl --system` or
# a hard error that aborts the rest of the file - which means the keys AFTER it
# are never applied either. Both outcomes are worse than refusing to write it.
#
# Three reasons a key is missing, all of them real:
#   - removed from the kernel:   net.ipv4.tcp_tw_recycle, gone in 4.12, still
#                                copied from tuning guides written in 2012
#   - needs a build option:      kernel.sched_migration_cost_ns requires
#                                CONFIG_SCHED_DEBUG, absent on some kernels
#   - its module is not loaded:  net.netfilter.nf_conntrack_max does not exist
#                                until nf_conntrack is, which is why modules.yml
#                                runs before sysctl.yml
#
# /proc/sys mirrors the key namespace as a directory tree, so the check is a
# path test - no sysctl binary needed, which also means it works on a host
# where procps is not installed yet.
# ---------------------------------------------------------------------------
# /bin/bash, not /bin/sh, and it is a portability decision rather than a habit:
# /bin/sh is dash on Debian and Ubuntu, dash has no `set -o pipefail`, and the
# repository's ansible-lint profile requires pipefail on any shell task
# containing a pipeline (risky-shell-pipe). All four target distributions ship
# bash, so bash is the portable choice here - the opposite of the usual advice,
# for a specific reason.
#
# The one place that must stay POSIX sh is templates/grub-dropin.cfg.j2, because
# grub-mkconfig sources it with /bin/sh.
- name: Validate | Find configured sysctl keys the running kernel does not have
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      missing=""
      for key in {{ kernel_sysctl_effective.keys() | join(' ') }}; do
        path="/proc/sys/$(printf '%s' "$key" | tr '.' '/')"
        [ -e "$path" ] || missing="$missing $key"
      done
      printf '%s' "${missing# }"
    executable: /bin/bash
  register: kernel_missing_keys
  changed_when: false
  check_mode: false

- name: Validate | Every configured sysctl key exists in the running kernel
  ansible.builtin.assert:
    that:
      - kernel_missing_keys.stdout | length == 0
    fail_msg: >-
      These keys are not present in this kernel's /proc/sys:
      {{ kernel_missing_keys.stdout }}.
      Either the key was removed from the kernel, or this kernel was built
      without the option that provides it, or the module that provides it is
      not loaded (add it to kernel_modules_extra). Writing it anyway would make
      `sysctl --system` skip or abort the whole file.
      Set kernel_sysctl_strict=false to write it regardless.
    success_msg: >-
      {{ kernel_sysctl_effective | length }} sysctl key(s) present in this kernel
    quiet: true
  when: kernel_sysctl_strict | bool

- name: Validate | Report keys that will be written but are not in this kernel
  ansible.builtin.debug:
    msg: >-
      NOT IN THIS KERNEL (kernel_sysctl_strict is false, writing anyway):
      {{ kernel_missing_keys.stdout }}
  when:
    - not (kernel_sysctl_strict | bool)
    - kernel_missing_keys.stdout | length > 0

# ---------------------------------------------------------------------------
# Boot arguments are space-separated on one line, so an argument containing a
# space would split into two and the second half would be nonsense the kernel
# ignores silently. Quoting does not help: this is the kernel's own parser.
# ---------------------------------------------------------------------------
- name: Validate | Boot arguments are single tokens
  ansible.builtin.assert:
    that:
      - kernel_cmdline_effective | select('search', '\s') | list | length == 0
    fail_msg: >-
      A kernel boot argument contains whitespace:
      {{ kernel_cmdline_effective | select('search', '\s') | list }}.
      The kernel command line is split on spaces, so this would become two
      arguments and the second would be ignored. Pass each one as its own list
      item (["hugepagesz=1G", "hugepages=8"], not ["hugepagesz=1G hugepages=8"]).
    quiet: true

- name: Validate | The sysctl binary exists when the values must be loaded now
  ansible.builtin.stat:
    path: "{{ kernel_sysctl_binary }}"
  register: kernel_sysctl_stat
  when: kernel_sysctl_apply | bool

- name: Validate | Refuse to promise a runtime load without the tool to do it
  ansible.builtin.assert:
    that:
      - kernel_sysctl_stat.stat.exists
    fail_msg: >-
      kernel_sysctl_apply is true but {{ kernel_sysctl_binary }} does not exist.
      Install procps-ng (RHEL/Amazon) or procps (Debian/SUSE) first - the
      baseline role owns packages - or set kernel_sysctl_apply=false to manage
      the file without loading it.
    quiet: true
  when: kernel_sysctl_apply | bool
