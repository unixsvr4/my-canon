---
# =============================================================================
# Verify the RUNNING kernel against the DESIRED state.
#
# This is the part that makes the role trustworthy rather than merely tidy.
# Every task above can succeed while the kernel runs something else entirely:
#
#   - a sysctl file written but never loaded (no handler fired, or a later
#     drop-in overrides the key)
#   - a boot argument written to the bootloader and not yet booted into
#   - a module option written while the module is already loaded with the old one
#
# "terraform apply succeeded" and "the environment is correct" are two
# different claims - the same reason lab 1 has verify-env.py. Here the two
# claims are "the files are right" and "the kernel is running it".
#
# The report distinguishes three outcomes, and only one of them is a failure:
#
#   active    configured and running now                   -> fine
#   PENDING   configured, needs a reboot to take effect    -> report (a
#             scheduling decision, not an error)
#   DIFFERS   configured, loadable at runtime, NOT loaded  -> FAILURE, because
#             something silently overrode it
# =============================================================================

- name: Verify | Compare the running kernel with the desired state
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      cmdline_active=0
      cmdline_pending=0
      sysctl_ok=0
      sysctl_differs=0
      sysctl_absent=0

      running=" $(tr -d '\n' < /proc/cmdline) "
      {% for arg in kernel_cmdline_effective %}
      case "$running" in
        *" {{ arg }} "*) printf 'CMDLINE  active   %s\n' '{{ arg }}'; cmdline_active=$((cmdline_active+1)) ;;
        *)               printf 'CMDLINE  PENDING  %s  (reboot required)\n' '{{ arg }}'; cmdline_pending=$((cmdline_pending+1)) ;;
      esac
      {% endfor %}

      while IFS='|' read -r key want; do
        [ -n "$key" ] || continue
        path="/proc/sys/$(printf '%s' "$key" | tr '.' '/')"
        if [ ! -e "$path" ]; then
          printf 'SYSCTL   ABSENT   %s  (not in this kernel)\n' "$key"
          sysctl_absent=$((sysctl_absent+1))
          continue
        fi
        # /proc/sys values can be tab-separated (tcp_rmem, ip_local_port_range),
        # so both sides are normalised to single spaces before comparing.
        have=$(tr -s '[:space:]' ' ' < "$path" | sed 's/^ *//; s/ *$//')
        wanted=$(printf '%s' "$want" | tr -s '[:space:]' ' ' | sed 's/^ *//; s/ *$//')
        if [ "$have" = "$wanted" ]; then
          printf 'SYSCTL   ok       %s = %s\n' "$key" "$have"
          sysctl_ok=$((sysctl_ok+1))
        else
          printf 'SYSCTL   DIFFERS  %s  want=%s running=%s\n' "$key" "$wanted" "$have"
          sysctl_differs=$((sysctl_differs+1))
        fi
      done <<'PAIRS'
      {% for key, value in kernel_sysctl_effective | dictsort %}
      {{ key }}|{{ value }}
      {% endfor %}
      PAIRS

      # Transparent huge pages have no sysctl, so they are checked where the
      # kernel actually exposes them. This is the setting most often believed
      # to be applied when it is not.
      if [ -r /sys/kernel/mm/transparent_hugepage/enabled ]; then
        printf 'THP      state    %s\n' "$(cat /sys/kernel/mm/transparent_hugepage/enabled)"
      fi

      printf 'SUMMARY cmdline_active=%d cmdline_pending=%d sysctl_ok=%d sysctl_differs=%d sysctl_absent=%d\n' \
        "$cmdline_active" "$cmdline_pending" "$sysctl_ok" "$sysctl_differs" "$sysctl_absent"
    executable: /bin/bash
  register: kernel_state
  changed_when: false
  check_mode: false

- name: Verify | Parse the summary
  ansible.builtin.set_fact:
    kernel_report: >-
      {{ dict(
           kernel_state.stdout_lines
           | select('match', '^SUMMARY ')
           | first
           | regex_replace('^SUMMARY ', '')
           | split(' ')
           | map('split', '=')
         ) }}

- name: Verify | The running kernel and the desired state
  ansible.builtin.debug:
    msg: "{{ kernel_state.stdout_lines | reject('match', '^SUMMARY ') | list }}"

# A runtime parameter that was written, loaded, and is still not the running
# value means something else owns that key: another drop-in sorting later than
# ours, a systemd unit, or a container runtime. That is a real failure, and it
# is exactly the class of bug the baseline role's `sshd -T` check exists for.
- name: Verify | Every runtime parameter is actually loaded
  ansible.builtin.assert:
    that:
      - kernel_report.sysctl_differs | int == 0
    fail_msg: >-
      {{ kernel_report.sysctl_differs }} runtime parameter(s) were written to
      {{ kernel_sysctl_file }} and loaded, and the kernel is still running a
      different value. Something later in sysctl's read order is overriding
      them - check `sysctl --system` output and
      /etc/sysctl.d, /run/sysctl.d, /usr/lib/sysctl.d for a file that sorts
      after {{ kernel_sysctl_file | basename }}. Details in the report above.
    success_msg: >-
      {{ kernel_report.sysctl_ok }} runtime parameter(s) loaded and running
    quiet: true
  when: kernel_sysctl_apply | bool

- name: Verify | Report boot arguments that need a reboot
  ansible.builtin.debug:
    msg: >-
      REBOOT REQUIRED: {{ kernel_report.cmdline_pending }} of
      {{ kernel_cmdline_effective | length }} boot argument(s) are configured
      and not yet active. The bootloader is correct; the running kernel was
      started before it. Reboot in a maintenance window, or set
      kernel_reboot_ok=true to let this role do it. In an image-build pipeline
      set kernel_fail_on_reboot_required=true instead, so an unfinished image
      fails the build.
  when: kernel_report.cmdline_pending | int > 0

- name: Verify | A pending reboot is a failure in a build pipeline
  ansible.builtin.assert:
    that:
      - kernel_report.cmdline_pending | int == 0
    fail_msg: >-
      {{ kernel_report.cmdline_pending }} boot argument(s) still need a reboot,
      and kernel_fail_on_reboot_required is set. This image or host is not
      finished.
    quiet: true
  when: kernel_fail_on_reboot_required | bool

# --- The reboot, only when explicitly allowed ---------------------------------
- name: Verify | Reboot to activate the boot arguments
  ansible.builtin.reboot:
    reboot_timeout: "{{ kernel_reboot_timeout }}"
    msg: "Rebooting to activate kernel boot arguments (kernel role)"
  when:
    - kernel_reboot_ok | bool
    - kernel_report.cmdline_pending | int > 0

- name: Verify | Confirm the boot arguments are active after the reboot
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      running=" $(tr -d '\n' < /proc/cmdline) "
      missing=""
      {% for arg in kernel_cmdline_effective %}
      case "$running" in *" {{ arg }} "*) ;; *) missing="$missing {{ arg }}" ;; esac
      {% endfor %}
      printf '%s' "${missing# }"
    executable: /bin/bash
  register: kernel_post_reboot
  changed_when: false
  when:
    - kernel_reboot_ok | bool
    - kernel_report.cmdline_pending | int > 0

# The check that catches a bootloader edit that looked fine and did not take -
# the wrong grub.cfg path, a drop-in that sorted earlier than expected, or a
# platform that supplies its own command line. Without it, "we rebooted" is
# assumed to mean "it is active now".
- name: Verify | The reboot really activated them
  ansible.builtin.assert:
    that:
      - kernel_post_reboot.stdout | length == 0
    fail_msg: >-
      After rebooting, these arguments are STILL not in /proc/cmdline:
      {{ kernel_post_reboot.stdout }}.
      The bootloader configuration was written but is not what this host booted
      from. On the RHEL family check `grubby --info=DEFAULT`; on Debian check
      that {{ kernel_grub_dropin | basename }} sorts last in
      /etc/default/grub.d; on SUSE check that grub2-mkconfig wrote the grub.cfg
      the firmware actually reads.
    success_msg: "all {{ kernel_cmdline_effective | length }} boot argument(s) active"
    quiet: true
  when:
    - kernel_reboot_ok | bool
    - kernel_post_reboot is not skipped
