---
# =============================================================================
# Verify the RUNNING kernel against the DESIRED state.
#
# This is the part that makes the role trustworthy rather than merely tidy.
# Every task above can succeed while the kernel runs something else entirely:
#
#   - a sysctl file written but never loaded (no handler fired, or a later
#     drop-in overrides the key)
#   - a boot argument written to the bootloader and not yet booted into
#   - a module option written while the module is already loaded with the old one
#   - a hugepage request the kernel accepted and could not satisfy
#
# "terraform apply succeeded" and "the environment is correct" are two
# different claims - the same reason lab 1 has verify-env.py. Here the two
# claims are "the files are right" and "the kernel is running it".
#
# Four outcomes, and only two of them are failures:
#
#   active    configured and running now                   -> fine
#   PENDING   configured, needs a reboot to take effect    -> report (a
#             scheduling decision, not an error)
#   DIFFERS   configured, loadable at runtime, NOT loaded  -> FAILURE, because
#             something silently overrode it
#   SHORT     boot argument active, kernel could not honour it -> FAILURE,
#             because the workload gets none of what was asked for
# =============================================================================

- name: Verify | Read the running kernel state
  ansible.builtin.include_tasks: verify-collect.yml

- name: Verify | The running kernel and the desired state
  ansible.builtin.debug:
    msg: "{{ kernel_state.stdout_lines | reject('match', '^SUMMARY ') | list }}"

# --- RUNTIME DRIFT: repair it, then judge it ---------------------------------
#
# The handler reloads sysctl when the FILE changes. That covers a first run and
# an edited profile, and it does not cover the most ordinary drift there is:
# someone ran `sysctl -w` during an incident, or a container runtime set a key,
# and the file on disk was right the whole time. Nothing changed, so nothing
# was notified, so the running kernel kept the tampered value and the role
# failed with a message about drop-in ordering that had nothing to do with it
# (RESEARCH.md A39).
#
# Reloading HERE, and only when the collected state actually differs, keeps
# both properties:
#
#   - a converged host still reports changed=0, because this never fires
#   - `sysctl -w` drift is corrected by the converge, which is what a
#     configuration management run is for
#
# It cannot paper over a real override, and that is the point of using
# `kernel_sysctl_apply_cmd` (`sysctl --system`) rather than `sysctl -p` on our
# own file: --system replays every drop-in in the real read order, so a file
# that legitimately sorts after ours wins again and the assert below still
# fails. The reload distinguishes the two causes instead of guessing between
# them - it repairs what a converge can repair, and leaves what it cannot.
#
# The condition is a FACT rather than `when: <the reload task> is changed`, and
# that is not only to satisfy ansible-lint's no-handler rule. The three tasks
# below are one decision - "this host has drifted" - taken once, from the
# collected state, and read three times. Gating them on the previous task's
# result would instead make each one depend on the one above it.
- name: Verify | Decide whether the running kernel has drifted from the file
  ansible.builtin.set_fact:
    kernel_sysctl_drifted: >-
      {{ (kernel_sysctl_apply | bool) and (kernel_report.sysctl_differs | int > 0) }}

- name: Verify | Reload sysctl because the running kernel has drifted
  ansible.builtin.command:
    cmd: "{{ kernel_sysctl_apply_cmd }}"
  changed_when: true
  when: kernel_sysctl_drifted | bool

# Re-collect, so the assert below - and the play's own summary - describe the
# kernel as it is after the reload rather than before it. Same reason as A28.
- name: Verify | Re-read the running kernel state after the reload
  ansible.builtin.include_tasks: verify-collect.yml
  when: kernel_sysctl_drifted | bool

- name: Verify | The running kernel after the sysctl reload
  ansible.builtin.debug:
    msg: "{{ kernel_state.stdout_lines | reject('match', '^SUMMARY ') | list }}"
  when: kernel_sysctl_drifted | bool

# A runtime parameter that was written, RELOADED, and is still not the running
# value means something else owns that key: another drop-in sorting later than
# ours, a systemd unit, or a container runtime. That is a real failure, and it
# is exactly the class of bug the baseline role's `sshd -T` check exists for.
- name: Verify | Every runtime parameter is actually loaded
  ansible.builtin.assert:
    that:
      - kernel_report.sysctl_differs | int == 0
    fail_msg: >-
      {{ kernel_report.sysctl_differs }} runtime parameter(s) were written to
      {{ kernel_sysctl_file }}, `{{ kernel_sysctl_apply_cmd }}` was then run
      again, and the kernel is STILL running a different value. Runtime drift
      would have been corrected by that reload, so this is not drift:
      something later in sysctl's read order owns the key. Check
      /etc/sysctl.d, /run/sysctl.d, /usr/local/lib/sysctl.d and
      /usr/lib/sysctl.d for a file that sorts after
      {{ kernel_sysctl_file | basename }}, and a systemd unit or container
      runtime that sets it. Details in the report above.
    success_msg: >-
      {{ kernel_report.sysctl_ok }} runtime parameter(s) loaded and running
    quiet: true
  when: kernel_sysctl_apply | bool

# --- The reboot, only when explicitly allowed ---------------------------------
#
# Then the state is collected AGAIN, so everything below - and the play's own
# summary - describes the kernel that is running now rather than the one that
# was running before the reboot.
- name: Verify | Reboot to activate the boot arguments
  ansible.builtin.reboot:
    reboot_timeout: "{{ kernel_reboot_timeout }}"
    msg: "Rebooting to activate kernel boot arguments (kernel role)"
  register: kernel_reboot
  when:
    - kernel_reboot_ok | bool
    - kernel_report.cmdline_pending | int > 0

- name: Verify | Re-read the running kernel state after the reboot
  ansible.builtin.include_tasks: verify-collect.yml
  when:
    - kernel_reboot_ok | bool
    - kernel_reboot is changed

- name: Verify | The running kernel after the reboot
  ansible.builtin.debug:
    msg: "{{ kernel_state.stdout_lines | reject('match', '^SUMMARY ') | list }}"
  when:
    - kernel_reboot_ok | bool
    - kernel_reboot is changed

# The check that catches a bootloader edit that looked fine and did not take -
# the wrong grub.cfg path, a drop-in that sorted earlier than expected, or a
# platform that supplies its own command line. Without it, "we rebooted" is
# assumed to mean "it is active now".
- name: Verify | The reboot really activated every boot argument
  ansible.builtin.assert:
    that:
      - kernel_report.cmdline_pending | int == 0
    fail_msg: >-
      After rebooting, {{ kernel_report.cmdline_pending }} of
      {{ kernel_cmdline_effective | length }} boot argument(s) are STILL not in
      /proc/cmdline. The bootloader configuration was written but is not what
      this host booted from. On the RHEL family check `grubby --info=DEFAULT`;
      on Debian check that {{ kernel_grub_dropin | basename }} sorts last in
      /etc/default/grub.d; on SUSE check that grub2-mkconfig wrote the grub.cfg
      the firmware actually reads.
    success_msg: >-
      all {{ kernel_report.cmdline_active }} boot argument(s) active after the reboot
    quiet: true
  when:
    - kernel_reboot_ok | bool
    - kernel_reboot is changed

- name: Verify | Report boot arguments that need a reboot
  ansible.builtin.debug:
    msg: >-
      REBOOT REQUIRED: {{ kernel_report.cmdline_pending }} of
      {{ kernel_cmdline_effective | length }} boot argument(s) are configured
      and not yet active. The bootloader is correct; the running kernel was
      started before it. Reboot in a maintenance window, or set
      kernel_reboot_ok=true to let this role do it. In an image-build pipeline
      set kernel_fail_on_reboot_required=true instead, so an unfinished image
      fails the build.
  when: kernel_report.cmdline_pending | int > 0

- name: Verify | A pending reboot is a failure in a build pipeline
  ansible.builtin.assert:
    that:
      - kernel_report.cmdline_pending | int == 0
    fail_msg: >-
      {{ kernel_report.cmdline_pending }} boot argument(s) still need a reboot,
      and kernel_fail_on_reboot_required is set. This image or host is not
      finished.
    quiet: true
  when: kernel_fail_on_reboot_required | bool

# An argument the kernel accepted but could not act on. `hugepages=N` is a
# request: the kernel reserves what it can find contiguously at boot and
# silently continues with less. /proc/cmdline still shows the argument, so a
# check that stops at "is it active?" reports success while the workload gets
# small pages.
- name: Verify | Huge pages were actually reserved, not just requested
  ansible.builtin.assert:
    that:
      - kernel_report.hugepage_short | default(0) | int == 0
    fail_msg: >-
      A hugepage reservation fell short - see the HUGEPAGE line in the report
      above. The boot argument is active and the kernel could not find that
      much contiguous memory, so the workload gets none of what was asked for.
      Lower kernel_hugepages_1g, or give the host more memory.
    success_msg: "hugepage reservations satisfied"
    quiet: true
  when: kernel_report.hugepage_short is defined
